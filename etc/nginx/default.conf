map $uri $blog_access_loggable {
    default 1;
    ~^/s/ 0;
}

server {
    server_name blog;
    root /var/www/backend/public;

    client_max_body_size 100M;

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header "Access-Control-Allow-Headers" "Content-Type, Authorization, X-Requested-With, X-Auth-Token, Origin, Accept, Link";
    add_header "Access-Control-Request-Methods" "GET, POST, PUT, PATCH, DELETE, OPTIONS";
    add_header "Access-Control-Allow-Credentials" "true";
    add_header 'Access-Control-Expose-Headers' 'Link';

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log combined if=$blog_access_loggable;
}
